[tool.poetry]
name = "sentinel-bench"
version = "0.1.0"
description = "Sentinel-Bench: Automated Constitutional Firewall benchmark for DAO governance"
authors = ["Sentinel Bench Research Group"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
dspy-ai = ">=3.1.3"
pydantic = "^2.0.0"
requests = "^2.32.0"
beautifulsoup4 = "^4.12.0"
pandas = "^2.2.0"
matplotlib = "^3.9.0"
seaborn = "^0.13.0"
tqdm = "^4.67.0"
jupyter = "^1.1.0"
ipykernel = "^6.29.0"
python-dotenv = "^1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
